<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Billiard ball 8 background -->
  <!-- Main circle - black -->
  <circle cx="100" cy="100" r="95" fill="#000000" stroke="#333333" stroke-width="3"/>
  
  <!-- White circle for number 8 -->
  <circle cx="100" cy="50" r="28" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  
  <!-- Number 8 -->
  <text x="100" y="58" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="32" font-weight="900" fill="#000000">8</text>
  
  <!-- Billiard ball shine effect -->
  <ellipse cx="85" cy="35" rx="15" ry="20" fill="rgba(255,255,255,0.3)" transform="rotate(-30 85 35)"/>
  
  <!-- Billiard table at bottom -->
  <g transform="translate(100, 155)">
    <!-- Table surface (green felt) -->
    <rect x="-45" y="-15" width="90" height="30" rx="6" fill="#228B22" stroke="#006400" stroke-width="2"/>
    
    <!-- Table rails (wooden borders) -->
    <rect x="-47" y="-17" width="94" height="34" rx="8" fill="#8B4513" stroke="#654321" stroke-width="1"/>
    <rect x="-45" y="-15" width="90" height="30" rx="6" fill="#228B22" stroke="#006400" stroke-width="1"/>
    
    <!-- Corner pockets (4 góc) -->
    <!-- Top left pocket -->
    <circle cx="-40" cy="-10" r="4" fill="#000000" stroke="#333333" stroke-width="1"/>
    <!-- Top right pocket -->
    <circle cx="40" cy="-10" r="4" fill="#000000" stroke="#333333" stroke-width="1"/>
    <!-- Bottom left pocket -->
    <circle cx="-40" cy="10" r="4" fill="#000000" stroke="#333333" stroke-width="1"/>
    <!-- Bottom right pocket -->
    <circle cx="40" cy="10" r="4" fill="#000000" stroke="#333333" stroke-width="1"/>
    
    <!-- Side pockets (2 lỗ giữa cạnh dài) -->
    <circle cx="-45" cy="0" r="3.5" fill="#000000" stroke="#333333" stroke-width="1"/>
    <circle cx="45" cy="0" r="3.5" fill="#000000" stroke="#333333" stroke-width="1"/>
    
    <!-- Table felt texture lines -->
    <line x1="-40" y1="-10" x2="40" y2="-10" stroke="#32CD32" stroke-width="0.3" opacity="0.3"/>
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#32CD32" stroke-width="0.3" opacity="0.3"/>
    <line x1="-40" y1="10" x2="40" y2="10" stroke="#32CD32" stroke-width="0.3" opacity="0.3"/>
    
    <!-- Vertical lines -->
    <line x1="-20" y1="-10" x2="-20" y2="10" stroke="#32CD32" stroke-width="0.3" opacity="0.3"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#32CD32" stroke-width="0.3" opacity="0.3"/>
    <line x1="20" y1="-10" x2="20" y2="10" stroke="#32CD32" stroke-width="0.3" opacity="0.3"/>
    
    <!-- Table legs indication -->
    <rect x="-35" y="15" width="4" height="6" fill="#654321"/>
    <rect x="31" y="15" width="4" height="6" fill="#654321"/>
  </g>
  
  <!-- Eagle -->
  <g transform="translate(100, 95)">
    <!-- Eagle body -->
    <ellipse cx="0" cy="3" rx="6" ry="12" fill="#CCCCCC" stroke="#FFFFFF" stroke-width="0.5"/>
    
    <!-- Eagle head -->
    <circle cx="0" cy="-6" r="5" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="0.5"/>
    
    <!-- Eagle beak -->
    <path d="M 0,-11 L 4,-9 L 0,-8 Z" fill="#FFD700" stroke="#FFA500" stroke-width="0.5"/>
    
    <!-- Eagle eye -->
    <circle cx="1.5" cy="-7" r="1" fill="#000"/>
    <circle cx="2" cy="-7.5" r="0.3" fill="#FFF"/>
    
    <!-- Eagle wings spread -->
    <!-- Left wing -->
    <path d="M -6,-2 C -20,-6 -28,-12 -32,-20 C -30,-16 -24,-10 -12,-6 L -6,3 Z" 
          fill="#CCCCCC" stroke="#FFFFFF" stroke-width="0.8"/>
    <!-- Left wing details -->
    <path d="M -10,-1 C -16,-5 -20,-8 -22,-14" stroke="#FFFFFF" stroke-width="0.5" fill="none"/>
    <path d="M -12,0 C -18,-3 -21,-6 -24,-12" stroke="#FFFFFF" stroke-width="0.5" fill="none"/>
    
    <!-- Right wing -->
    <path d="M 6,-2 C 20,-6 28,-12 32,-20 C 30,-16 24,-10 12,-6 L 6,3 Z" 
          fill="#CCCCCC" stroke="#FFFFFF" stroke-width="0.8"/>
    <!-- Right wing details -->
    <path d="M 10,-1 C 16,-5 20,-8 22,-14" stroke="#FFFFFF" stroke-width="0.5" fill="none"/>
    <path d="M 12,0 C 18,-3 21,-6 24,-12" stroke="#FFFFFF" stroke-width="0.5" fill="none"/>
    
    <!-- Eagle tail -->
    <path d="M 0,15 L -2,22 L 0,25 L 2,22 Z" fill="#CCCCCC" stroke="#FFFFFF" stroke-width="0.5"/>
    
    <!-- Eagle legs -->
    <line x1="-2" y1="13" x2="-3" y2="20" stroke="#FFD700" stroke-width="1"/>
    <line x1="2" y1="13" x2="3" y2="20" stroke="#FFD700" stroke-width="1"/>
    <!-- Eagle talons -->
    <path d="M -3,20 L -4,22 M -3,20 L -2,22 M -3,20 L -1,22" stroke="#FFD700" stroke-width="0.8" fill="none"/>
    <path d="M 3,20 L 4,22 M 3,20 L 2,22 M 3,20 L 1,22" stroke="#FFD700" stroke-width="0.8" fill="none"/>
  </g>
  

  
  <!-- Text below -->
  <text x="100" y="185" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" stroke="#000000" stroke-width="0.5">UHPD.SHOP</text>
  
  <!-- Billiard ball reflection -->
  <defs>
    <radialGradient id="ballShine" cx="30%" cy="20%" r="40%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.4);stop-opacity:1" />
      <stop offset="70%" style="stop-color:rgba(255,255,255,0.1);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0);stop-opacity:1" />
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#ballShine)"/>
</svg>